<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생일 축하해 🎂</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:Arial,"Noto Sans KR",sans-serif;background:linear-gradient(135deg,#ffe5ec,#fff4d6,#e5f3ff);overflow:hidden}
.card{width:min(90%,520px);padding:55px 30px 45px;text-align:center;background:rgba(255,255,255,.88);border-radius:30px;box-shadow:0 20px 60px rgba(120,80,100,.18);animation:appear .8s ease}
.emoji{font-size:64px;margin-bottom:18px;animation:bounce 2s infinite}
h1{margin:0 0 16px;color:#333;font-size:clamp(25px,6vw,36px);line-height:1.35}
p{color:#777;font-size:16px;margin:0 0 35px}
.buttons{display:flex;justify-content:center;align-items:center;gap:16px;min-height:62px}
button{border:0;border-radius:15px;padding:15px 34px;font-size:17px;font-weight:700;cursor:pointer;transition:all .25s ease}
#yes{background:#ff6f91;color:white;box-shadow:0 8px 20px rgba(255,111,145,.3)}
#yes:hover{transform:translateY(-3px) scale(1.04)}
#no{background:#eee;color:#777}
.message{display:none;animation:appear .7s ease}
.message h2{font-size:32px;margin:0 0 18px;color:#ff5d83}
.message p{line-height:1.8;margin:0}
.heart{position:fixed;font-size:22px;animation:floatUp 4s linear forwards;pointer-events:none}
@keyframes appear{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes floatUp{from{transform:translateY(0) rotate(0);opacity:1}to{transform:translateY(-110vh) rotate(360deg);opacity:0}}
</style>
</head>
<body>
<div class="card">
  <div id="question">
    <div class="emoji">🎂</div>
    <h1>생일 축하해! 🎉<br>내가 선물을 줄 건데 받을 거야?</h1>
    <p>신중하게 선택해 주세요... 😏</p>
    <div class="buttons">
      <button id="yes">Yas 💝</button>
      <button id="no">No 🙅</button>
    </div>
  </div>
  <div class="message" id="gift">
    <div class="emoji">🎁</div>
    <h2>선물 받기 성공! 💕</h2>
    <p>좋아! 그럼 다음 페이지에서<br>진짜 선물을 보여줄게 😎<br><br>잠깐만 기다려줘!</p>
  </div>
</div>
<script>
const yes=document.getElementById("yes");
const no=document.getElementById("no");
const question=document.getElementById("question");
const gift=document.getElementById("gift");
let noSize=1;

yes.addEventListener("click",()=>{
  question.style.display="none";
  gift.style.display="block";
  for(let i=0;i<25;i++)setTimeout(createHeart,i*70);
});

no.addEventListener("click",()=>{
  noSize*=.65;
  if(noSize<.05)noSize=.05;
  no.style.transform=`scale(${noSize})`;
  no.style.opacity=Math.max(noSize,.25);
  if(noSize<=.05){
    no.style.pointerEvents="none";
    no.textContent="No 😢";
  }
});

function createHeart(){
  const heart=document.createElement("div");
  heart.className="heart";
  heart.textContent=["💗","💕","💖","🎉","✨"][Math.floor(Math.random()*5)];
  heart.style.left=Math.random()*100+"vw";
  heart.style.top=(80+Math.random()*20)+"vh";
  heart.style.fontSize=(16+Math.random()*20)+"px";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),4000);
}
</script>
</body>
</html>
